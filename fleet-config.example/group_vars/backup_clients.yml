---
# Real values for hosts/roles/backup -- applies to tag:backup-client hosts.
# Engine is restic, to an offsite S3-compatible target (NOT the same box's
# own object storage, if it has one — a backup sharing a failure domain
# with what it protects isn't a backup).

backup_repo_url: "s3:https://CHANGEME-endpoint/CHANGEME-bucket/{{ inventory_hostname }}"
backup_paths_default:
  - /opt
  - /var/lib/docker/volumes
backup_retention: { daily: 7, weekly: 4, monthly: 6 }

# Secrets (backup_restic_password, backup_s3_access_key, backup_s3_secret_key)
# come from group_vars/all/vault.yml, never from here.
