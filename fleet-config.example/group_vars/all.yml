---
# Defaults applied to every host. Override per-group in a
# group_vars/<group>.yml file (e.g. group_vars/swarm_manager.yml) as real
# distinctions show up, or per-host in host_vars/<hostname>.yml.

docker_mode: standalone   # standalone | swarm — set per-group once swarm hosts exist

# Set once stacks/wazuh/ is deployed in your fleet -- the security_posture
# role refuses to enroll a wazuh-agent without this. Tailscale address of
# the tag:wazuh-manager host, e.g.:
# security_posture_wazuh_manager_addr: 100.x.x.x
