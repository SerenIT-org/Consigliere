---
# Entry point for both reconcile.sh (scheduled, on every host) and Semaphore
# (on-demand / webhook-triggered). Keep this file boring — real logic lives
# in the roles.

- name: Fleet baseline + maintenance
  hosts: all
  become: true
  pre_tasks:
    # Automatic OS groups (os_linux, os_linux_debian, os_darwin, os_darwin_macosx, ...)
    # so vars/group/os_<...>.yml and plays can target by OS with no table entry.
    - name: Group by operating system
      ansible.builtin.group_by:
        key: "{{ item }}"
      loop:
        - "os_{{ ansible_system | lower }}"
        - "os_{{ ansible_system | lower }}_{{ ansible_distribution | lower | replace(' ', '_') }}"
      changed_when: false
      tags: [always]
  roles:
    - baseline
    - tailscale
    - docker

- name: Wazuh agents (opt-in via the wazuh_agent group, once a manager exists)
  hosts: wazuh_agent
  become: true
  roles:
    - wazuh_agent

- name: Wazuh manager host prerequisites
  hosts: wazuh_server
  become: true
  roles:
    - wazuh_server

- name: Arkeep server
  hosts: arkeep_server
  become: true
  roles:
    - arkeep_server

- name: Arkeep agents
  hosts: arkeep_agent
  become: true
  roles:
    - arkeep_agent

- name: Arcane manager
  hosts: arcane_server
  become: true
  roles:
    - arcane_server

- name: Arcane agents
  hosts: arcane_agent
  become: true
  roles:
    - arcane_agent

- name: Semaphore (coordination server)
  hosts: semaphore_server
  become: true
  roles:
    - semaphore_server

- name: Cert Warden (central ACME client)
  hosts: certwarden_server
  become: true
  roles:
    - certwarden_server

- name: Certificate consumers (fetch from Cert Warden)
  hosts: certwarden_agent
  become: true
  roles:
    - certwarden_agent

- name: Traefik edge configuration
  hosts: traefik_server
  become: true
  roles:
    - traefik_server
