---
# Entry point for both ansible-pull (scheduled, on every host) and Semaphore
# (on-demand / webhook-triggered). Keep this file boring — real logic lives
# in the roles.

- name: Consigliere baseline + maintenance
  hosts: all
  become: true
  roles:
    - baseline
    - tailscale
    - docker
    - security_posture

- name: Wazuh manager host prerequisites
  hosts: wazuh_manager
  become: true
  roles:
    - wazuh_host
