---
# Entry point for both reconcile.sh (scheduled, on every host) and Semaphore
# (on-demand / webhook-triggered). Keep this file boring — real logic lives
# in the roles.

- name: Fleet baseline + maintenance
  hosts: all
  become: true
  roles:
    - baseline
    - tailscale
    - docker
    - security_posture

- name: Wazuh manager host prerequisites
  hosts: wazuh_manager
  become: true
  roles:
    - wazuh_host

- name: Arkeep server
  hosts: arkeep_server
  become: true
  roles:
    - arkeep_server

- name: Arkeep agents
  hosts: arkeep_agent
  become: true
  roles:
    - arkeep_agent

- name: Arcane manager
  hosts: arcane_manager
  become: true
  roles:
    - arcane_manager

- name: Arcane agents
  hosts: arcane_agent
  become: true
  roles:
    - arcane_agent
