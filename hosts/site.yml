---
# Entry point for both reconcile.sh (scheduled, on every host) and Semaphore
# (on-demand / webhook-triggered). Keep this file boring — real logic lives
# in the roles.

- name: Fleet baseline + maintenance
  hosts: all
  become: true
  roles:
    - baseline
    - tailscale
    - docker

- name: Wazuh agents (opt-in via the agent_wazuh group, once a manager exists)
  hosts: agent_wazuh
  become: true
  roles:
    - agent_wazuh

- name: Wazuh manager host prerequisites
  hosts: server_wazuh
  become: true
  roles:
    - server_wazuh

- name: Arkeep server
  hosts: server_arkeep
  become: true
  roles:
    - server_arkeep

- name: Arkeep agents
  hosts: agent_arkeep
  become: true
  roles:
    - agent_arkeep

- name: Arcane manager
  hosts: server_arcane
  become: true
  roles:
    - server_arcane

- name: Arcane agents
  hosts: agent_arcane
  become: true
  roles:
    - agent_arcane

- name: Semaphore (coordination server)
  hosts: server_semaphore
  become: true
  roles:
    - server_semaphore

- name: Traefik edge prerequisites
  hosts: server_traefik
  become: true
  roles:
    - server_traefik
