---
# Applied to the server_arcane group. Deploys Arcane's manager UI behind a
# docker-socket-proxy (this node is internet-facing). See defaults/main.yml
# for what's expected from your private fleet-config repo.

- name: Fail fast if the Arcane encryption key isn't configured
  ansible.builtin.fail:
    msg: >-
      server_arcane_encryption_key is not set -- it comes from your private
      fleet-config repo's config/vars/group/all/vault.yml (see
      consigliere-fleet-template/config/vars/group/all/vault.yml.example). Generate
      with: openssl rand -base64 32
  when: >-
    server_arcane_encryption_key is not defined or not server_arcane_encryption_key or
    server_arcane_encryption_key is search('CHANGEME')

- name: Create Arcane directory
  ansible.builtin.file:
    path: "{{ server_arcane_dir }}"
    state: directory
    mode: "0750"

- name: Write Arcane compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ server_arcane_dir }}/docker-compose.yml"
    mode: "0640"
  register: _server_arcane_compose

- name: Create the shared proxy network (so Traefik and this service can reach each other by name)
  community.docker.docker_network:
    name: "{{ server_arcane_network }}"
  when: server_arcane_network | length > 0

- name: Start Arcane
  community.docker.docker_compose_v2:
    project_src: "{{ server_arcane_dir }}"
    state: present
    pull: "{{ 'always' if _server_arcane_compose.changed else 'missing' }}"
