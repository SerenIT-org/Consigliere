---
# Applied to tag:backup-client hosts (see hosts/inventory/tailscale.yml).
# Restic engine only -- installs restic, initializes the repository, and
# sets up a daily backup + prune timer. Deliberately does not install
# Arkeep or Zerobyte: which one fronts this with a central console/agent
# architecture is still an open decision (see VISION.md).

- name: Fail fast if the restic repo isn't configured
  ansible.builtin.fail:
    msg: >-
      backup_repo_url is not set -- it comes from your private fleet-config
      repo's group_vars/backup_clients.yml (see fleet-config.example/).
      Deliberately not defaulted: an unset repo must never silently skip
      backups.
  when: backup_repo_url is not defined or not backup_repo_url

- name: Fail fast if restic credentials aren't configured
  ansible.builtin.fail:
    msg: >-
      backup_restic_password / backup_s3_access_key / backup_s3_secret_key
      are not set -- these come from your private fleet-config repo's
      group_vars/all/vault.yml (ansible-vault encrypted). See
      fleet-config.example/group_vars/all/vault.yml.example.
  when: >-
    backup_restic_password is not defined or not backup_restic_password or
    backup_s3_access_key is not defined or not backup_s3_access_key or
    backup_s3_secret_key is not defined or not backup_s3_secret_key

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true

- name: Write restic environment file
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic.env
    owner: root
    group: root
    mode: "0600"
    # NOTE: readable only by root -- the backup script below runs as root
    # via the systemd unit, not as the invoking user.

- name: Initialize restic repository (idempotent -- no-ops if already initialized)
  ansible.builtin.command:
    cmd: restic init
  environment:
    RESTIC_REPOSITORY: "{{ backup_repo_url }}"
    RESTIC_PASSWORD: "{{ backup_restic_password }}"
    AWS_ACCESS_KEY_ID: "{{ backup_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ backup_s3_secret_key }}"
  register: _backup_restic_init
  failed_when: >-
    _backup_restic_init.rc != 0 and
    'already initialized' not in _backup_restic_init.stderr
  changed_when: _backup_restic_init.rc == 0

- name: Install backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/sbin/restic-backup.sh
    owner: root
    group: root
    mode: "0700"

- name: Install systemd service + timer for daily backup
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - restic-backup.service
    - restic-backup.timer
  notify: Reload systemd

- name: Enable + start the backup timer
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started
    daemon_reload: true
