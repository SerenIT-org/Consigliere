---
- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /usr/share/keyrings/docker-archive-keyring.asc
    mode: "0644"

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/usr/share/keyrings/docker-archive-keyring.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

# Services publish ports on the host's Tailscale IP (see the server_* roles).
# Docker can't bind an address that doesn't exist yet, so after a reboot it must
# start after tailscaled has brought the interface up.
- name: Create the docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Order docker after tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-after-tailscale.conf
    content: |
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
    mode: "0644"
  notify: Reload systemd for docker

- name: Enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Configure swarm mode
  ansible.builtin.include_tasks: swarm.yml
  when: docker_mode == 'swarm'
