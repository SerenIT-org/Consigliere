---
- name: Fail fast if Semaphore secrets aren't configured
  ansible.builtin.fail:
    msg: >-
      server_semaphore_admin_password / server_semaphore_access_key_encryption are not
      set -- put them in your fleet-config config/vars/group/all/vault.yml (see
      vault.yml.example).
  when: >-
    server_semaphore_admin_password is not defined or not server_semaphore_admin_password or
    server_semaphore_admin_password is search('CHANGEME') or
    server_semaphore_access_key_encryption is not defined or not server_semaphore_access_key_encryption or
    server_semaphore_access_key_encryption is search('CHANGEME')

- name: Create Semaphore directory
  ansible.builtin.file:
    path: "{{ server_semaphore_dir }}"
    state: directory
    mode: "0750"

- name: Write Semaphore compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ server_semaphore_dir }}/docker-compose.yml"
    mode: "0640"
  register: _server_semaphore_compose

- name: Start Semaphore
  community.docker.docker_compose_v2:
    project_src: "{{ server_semaphore_dir }}"
    state: present
    pull: "{{ 'always' if _server_semaphore_compose.changed else 'missing' }}"
