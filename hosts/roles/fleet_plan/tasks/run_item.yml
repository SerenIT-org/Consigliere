---
# One item of the plan from the tag manifests: a role or a task file. The manifest's
# optional vars are set as host variables first (include_role/include_tasks do not accept
# a templated dict for `vars:`).
- name: "Set the vars the manifest presets: {{ _fleet_item.tag }}"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _fleet_item.vars | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "Role {{ _fleet_item.name | default('') }}"
  ansible.builtin.include_role:
    name: "{{ _fleet_item.name }}"
  when: _fleet_item.kind == 'role'

- name: "Tasks {{ _fleet_item.file | default('') }}"
  ansible.builtin.include_tasks: "{{ _fleet_item.file }}"
  when: _fleet_item.kind == 'tasks'
