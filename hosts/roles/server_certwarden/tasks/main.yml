---
- name: Create the Cert Warden directory
  ansible.builtin.file:
    path: "{{ server_certwarden_dir }}"
    state: directory
    mode: "0750"

- name: Write the Cert Warden compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ server_certwarden_dir }}/docker-compose.yml"
    mode: "0640"
  register: _server_certwarden_compose

- name: Start Cert Warden
  community.docker.docker_compose_v2:
    project_src: "{{ server_certwarden_dir }}"
    state: present
    pull: "{{ 'always' if _server_certwarden_compose.changed else 'missing' }}"
