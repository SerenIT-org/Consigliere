---
# Loads secrets/cw/<name>.yml (vault id cw.<name>) for one requested certificate.
- name: "Read the API keys for certificate {{ _cw_name }}"
  ansible.builtin.include_vars:
    file: "{{ certwarden_agent_secrets_dir }}/cw/{{ _cw_name }}.yml"
    name: _cw_loaded
  register: _cw_read
  ignore_errors: true
  no_log: true

- name: "Stop with a clear message if {{ _cw_name }} cannot be read"
  ansible.builtin.fail:
    msg: >-
      Cannot read the API keys for certificate {{ _cw_name }}: expected
      {{ certwarden_agent_secrets_dir }}/cw/{{ _cw_name }}.yml, encrypted with
      vault id cw.{{ _cw_name }}. Either the file does not exist in the fleet repo,
      or this host does not hold the password cw.{{ _cw_name }} (it was not granted
      this certificate).
  when: _cw_read is failed

- name: "Remember the keys for {{ _cw_name }}"
  ansible.builtin.set_fact:
    _certwarden_agent_all_keys: >-
      {{ _certwarden_agent_all_keys | combine({_cw_name: {
           'cert': (_cw_loaded.cert | default('CHANGEME') | string),
           'key': (_cw_loaded.key | default('CHANGEME') | string)}}) }}
  no_log: true
