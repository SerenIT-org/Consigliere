---
# Loads secrets/cw/<name>.yml (sops, scope cw.<name>) for one requested certificate.
- name: "Decrypt the API keys for certificate {{ _cw_name }}"
  ansible.builtin.include_role:
    name: load_secrets
    tasks_from: read
  vars:
    load_secrets_scope: "cw.{{ _cw_name }}"

- name: "Remember the keys for {{ _cw_name }}"
  ansible.builtin.set_fact:
    _certwarden_agent_all_keys: >-
      {{ _certwarden_agent_all_keys | combine({_cw_name: {
           'cert': (_load_secrets_data.cert | default('CHANGEME') | string),
           'key': (_load_secrets_data.key | default('CHANGEME') | string)}}) }}
  no_log: true
