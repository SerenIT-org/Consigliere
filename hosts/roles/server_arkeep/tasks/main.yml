---
# Applied to the server_arkeep group. Deploys the Arkeep server (central backup
# console) via Docker Compose -- see defaults/main.yml for what's expected
# from your private fleet-config repo.

- name: Fail fast if Arkeep secrets aren't configured
  ansible.builtin.fail:
    msg: >-
      server_arkeep_secret_key / agent_arkeep_secret are not set -- these come
      from your private fleet-config repo's config/vars/group/all/vault.yml (see
      consigliere-fleet-template/config/vars/group/all/vault.yml.example).
      agent_arkeep_secret must be identical to the value every
      agent_arkeep host uses -- it's a shared secret, not per-host.
  when: >-
    server_arkeep_secret_key is not defined or not server_arkeep_secret_key or
    server_arkeep_secret_key is search('CHANGEME') or
    agent_arkeep_secret is not defined or not agent_arkeep_secret or
    agent_arkeep_secret is search('CHANGEME')

- name: Create Arkeep server directory
  ansible.builtin.file:
    path: "{{ server_arkeep_dir }}"
    state: directory
    mode: "0750"

- name: Write Arkeep server compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ server_arkeep_dir }}/docker-compose.yml"
    mode: "0640"
  register: _server_arkeep_compose

- name: Create the shared proxy network (so Traefik and this service can reach each other by name)
  community.docker.docker_network:
    name: "{{ server_arkeep_network }}"
  when: server_arkeep_network | length > 0

- name: Start Arkeep server
  community.docker.docker_compose_v2:
    project_src: "{{ server_arkeep_dir }}"
    state: present
    pull: "{{ 'always' if _server_arkeep_compose.changed else 'missing' }}"
