---
- name: Set timezone (only when baseline_timezone is set; otherwise leave it alone)
  community.general.timezone:
    name: "{{ baseline_timezone }}"
  when: baseline_timezone | length > 0

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

# A drop-in instead of editing the vendor's 50unattended-upgrades: apt reads
# apt.conf.d in order and the last value wins, so this needs no particular
# contents (or even the package) to exist first, and survives package upgrades.
- name: Configure unattended-upgrades auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52consigliere-unattended-upgrades
    content: |
      // Managed by Ansible (hosts/roles/baseline)
      Unattended-Upgrade::Automatic-Reboot "{{ baseline_unattended_upgrades_auto_reboot | lower }}";
    owner: root
    group: root
    mode: "0644"

- name: Enable ufw with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    name: OpenSSH
    # NOTE: once the tailscale role has run, consider tightening this to
    # only allow SSH on the tailscale0 interface (`interface: tailscale0`)
    # rather than every interface.
