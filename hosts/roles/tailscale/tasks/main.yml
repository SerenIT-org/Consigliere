---
- name: Add Tailscale apt repo + install
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repo
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Enable + start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Join tailnet
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale_authkey }}
      --advertise-tags={{ tailscale_tags }}
      {{ tailscale_args }}
  register: _tailscale_up
  changed_when: "'Success' in _tailscale_up.stdout or _tailscale_up.rc == 0"
  # NOTE: this re-runs `tailscale up` every reconciliation pass since there's
  # no clean idempotent check baked in yet — harmless (tailscale no-ops if
  # already joined with the same args) but worth tightening with a
  # `tailscale status --json` pre-check if that proves noisy in practice.
