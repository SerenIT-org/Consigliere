---
# Applied to the agent_arkeep group (every host that gets backed up). Reproduces
# github.com/arkeep-io/arkeep's deploy/docker/docker-compose.agent.yml as a
# template, verified against that file 2026-10-01.
#
# server_arkeep_addr: gRPC host:port of the server_arkeep host -- its
# Tailscale address, e.g. 100.x.x.x:9090. Set in your fleet-config repo,
# not here (it's fleet-specific, not a secret, but still doesn't belong in
# this public framework).
# agent_arkeep_secret: shared secret, from config/vars/group/all/vault.yml --
# MUST match the value hosts/roles/server_arkeep uses.
agent_arkeep_dir: /opt/arkeep-agent
agent_arkeep_log_level: info

# Set to the server_arkeep's public HTTPS URL (matching its arkeep_base_url)
# when that server is behind a reverse proxy -- required for this agent's
# enrollment call to reach it. Leave empty if the server exposes port 8080
# directly. See hosts/roles/server_arkeep/README.md.
agent_arkeep_server_http_addr: ""

# Paths on THIS host to offer as backup sources in Arkeep's UI (read-only
# mount). Backup policies themselves are configured centrally in Arkeep's
# GUI, not here -- this just controls what paths are visible to pick from.
agent_arkeep_backup_paths: []
