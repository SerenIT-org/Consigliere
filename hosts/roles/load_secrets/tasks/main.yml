---
# Loads named secrets from the fleet repo. Scope "<kind>.<name>" is the file
# <fleet_secrets_dir>/<kind>/<name>.yml, encrypted with sops to the age keys of the
# hosts allowed to read it. Use from a role:
#   - ansible.builtin.include_role: {name: load_secrets}
#     vars: {load_secrets_scopes: [arkeep.agent, arkeep.server]}
# Every top-level key of each file becomes a host variable. A host that is not a
# recipient of a file stops with a clear message instead of running half-configured.
- name: Load each requested secret
  ansible.builtin.include_tasks: load_one.yml
  loop: "{{ load_secrets_scopes }}"
  loop_control:
    loop_var: load_secrets_scope
