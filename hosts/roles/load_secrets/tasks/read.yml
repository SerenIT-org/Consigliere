---
# Decrypts one scope into the fact _load_secrets_data (a dict). Input: load_secrets_scope.
- name: "Decrypt secret {{ load_secrets_scope }}"
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - --output-type
      - json
      - "{{ load_secrets_dir }}/{{ load_secrets_scope.split('.', 1)[0] }}/{{ load_secrets_scope.split('.', 1)[1] }}.yml"
  environment:
    SOPS_AGE_KEY_FILE: "{{ load_secrets_age_key_file }}"
  register: _load_secrets_out
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: "Stop with a clear message if a secret cannot be decrypted: {{ load_secrets_scope }}"
  ansible.builtin.fail:
    msg: >-
      Cannot decrypt secret {{ load_secrets_scope }}
      ({{ load_secrets_dir }}/{{ load_secrets_scope.split('.', 1)[0] }}/{{ load_secrets_scope.split('.', 1)[1] }}.yml).
      Either the file is missing from the fleet repo (scripts/secrets.sh create {{ load_secrets_scope }}),
      or this host is not a recipient of it: grant it from your admin machine
      (scripts/access.sh show; scripts/access.sh sync; push). sops said:
      {{ (_load_secrets_out.stderr | default('') | trim).splitlines() | first | default('(nothing)') }}
  when: _load_secrets_out.rc != 0

- name: "Remember {{ load_secrets_scope }}"
  ansible.builtin.set_fact:
    _load_secrets_data: "{{ _load_secrets_out.stdout | from_json }}"
  no_log: true
