---
# Wazuh agent enrollment -- replaces the earlier Lynis + Linux Malware
# Detect approach (see VISION.md: "Security posture / malware detection —
# moving to Wazuh"). Wazuh gives fleet-wide FIM/rootkit/malware detection
# with a real single-pane dashboard instead of two separate CLI tools and
# no aggregation; the manager/indexer/dashboard stack lives in
# stacks/wazuh/, this role is just the agent side.
#
# Steps below mirror Wazuh's own documented apt install exactly (as of
# 2026-08-21) rather than using the deprecated ansible.builtin.apt_key
# module -- see https://documentation.wazuh.com, Linux agent install.

- name: Fail fast if no Wazuh manager address is configured
  ansible.builtin.fail:
    msg: >-
      agent_wazuh_manager_addr is not set -- point it at the the server_wazuh group
      host's Tailscale address (see stacks/wazuh/README.md) before this
      role can enroll an agent.
  when: not agent_wazuh_manager_addr

- name: Install apt prerequisites for the Wazuh repo
  ansible.builtin.apt:
    name:
      - gnupg
      - apt-transport-https
    state: present

- name: Download Wazuh GPG key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /tmp/GPG-KEY-WAZUH
    mode: "0644"

- name: Import Wazuh GPG key into its own keyring
  ansible.builtin.command:
    cmd: >-
      gpg --no-default-keyring
      --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg
      --import /tmp/GPG-KEY-WAZUH
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Fix keyring permissions
  ansible.builtin.file:
    path: /usr/share/keyrings/wazuh.gpg
    mode: "0644"

- name: Add Wazuh apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/wazuh.gpg]
      https://packages.wazuh.com/{{ agent_wazuh_apt_repo_version }}/apt/ stable main
    state: present
    filename: wazuh

- name: Install wazuh-agent
  ansible.builtin.apt:
    name: wazuh-agent
    state: present
    update_cache: true
  environment:
    WAZUH_MANAGER: "{{ agent_wazuh_manager_addr }}"
    # NOTE: WAZUH_MANAGER only templates /var/ossec/etc/ossec.conf on *first*
    # install -- apt's state=present is a no-op on repeat ansible-pull runs
    # once the package exists, so changing agent_wazuh_manager_addr later needs an
    # explicit ossec.conf update, not just a re-run of this task. Fine for a
    # single-manager setup; revisit if a second manager ever exists.

- name: Enable + start wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true
