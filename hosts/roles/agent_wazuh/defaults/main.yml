---
# server_wazuh_addr -- the Tailscale address (or hostname) of the server_wazuh
# host -- is NOT defined here: it describes the server, so it comes from your
# fleet repo (config/vars/group/), like server_arkeep_addr does for the Arkeep
# agents. See stacks/wazuh/README.md for standing the server up. This role
# refuses to run without it (see tasks/main.yml).

# Wazuh's apt repo is versioned by major line, not exact patch (.../4.x/...
# stays 4.x across 4.y.z releases). This MUST match the manager's major
# version -- verify against whatever's actually deployed via
# stacks/wazuh/vendor (pinned to v4.14.7 as of 2026-08-21) before changing.
agent_wazuh_apt_repo_version: "4.x"
